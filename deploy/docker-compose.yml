# The app behind Caddy, which fetches and renews the HTTPS certificate automatically.
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_FILE: /data/kajakklub.db
      PORT: "3000"
    volumes:
      - ./data:/data
      - ./backups:/backups

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
